<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xưởng Xe Hơi 8 Giờ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22090d;
  --paper:#f3ead6;
  --paper-dim:#e8dcc0;
  --card:#fffaf0;
  --brass:#bd8a34;
  --brass-dim:#e8c988;
  --indigo:#671626;
  --indigo-dim:#a13a4a;
  --indigo-pale:#f2dde1;
  --rust:#9c4227;
  --rust-dim:#e3a98f;
  --rust-pale:#f3ddd2;
  --good:#3f7d4c;
  --good-pale:#dcefd8;
  --danger:#a4332a;
  --danger-pale:#f3d7d0;
  --text:#241c12;
  font-family:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);}
body{min-height:100vh; overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif; margin:0 0 .3em; font-weight:650; line-height:1.15;}
p{margin:.3em 0; line-height:1.55;}
button{font-family:inherit; cursor:pointer;}
.mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--brass-dim);}

/* ===================== animated background (hero) ===================== */
.hero-bgfx{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
.hero-bgfx .gear{position:absolute; opacity:.16; font-size:5.5rem; animation:spinSlow 22s linear infinite;}
.hero-bgfx .gear.g2{animation-duration:30s; animation-direction:reverse; font-size:3.6rem;}
.hero-bgfx .gear.g3{animation-duration:26s; font-size:4.4rem;}
.hero-bgfx .puff{position:absolute; bottom:-40px; width:70px; height:70px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,0) 70%); animation:floatUp 9s ease-in infinite;}
.hero-bgfx .thread{position:absolute; font-size:1.8rem; opacity:.35; animation:driftSide 14s ease-in-out infinite;}
@keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes floatUp{0%{transform:translateY(0) scale(.6); opacity:0;}15%{opacity:.6;}100%{transform:translateY(-420px) scale(1.3); opacity:0;}}
@keyframes driftSide{0%,100%{transform:translateX(0) rotate(0deg);}50%{transform:translateX(24px) rotate(12deg);}}
@keyframes popIn{from{opacity:0; transform:scale(.9) translateY(8px);}to{opacity:1; transform:scale(1) translateY(0);}}
@keyframes slideFade{from{opacity:0; transform:translate(-50%,10px);}to{opacity:1; transform:translate(-50%,0);}}
@keyframes shimmerGlow{0%,100%{box-shadow:0 0 0 0 rgba(189,138,52,.5);}50%{box-shadow:0 0 0 8px rgba(189,138,52,0);}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg); opacity:1;}100%{transform:translateY(360px) rotate(420deg); opacity:0;}}
@keyframes badgeIn{from{transform:scale(.5); opacity:0;}to{transform:scale(1); opacity:1;}}

/* ===================== start screen ===================== */
#start-screen{position:relative; min-height:100vh; background:linear-gradient(160deg,#170709,#671626 55%,#2a0f12); color:#f3ead6; display:flex; align-items:center; justify-content:center; padding:30px;}
.start-box{position:relative; z-index:2; max-width:680px; text-align:center;}
.start-box .kicker{font-family:'JetBrains Mono',monospace; letter-spacing:.14em; font-size:.75rem; color:var(--brass-dim); text-transform:uppercase; margin-bottom:10px;}
.start-box h1{font-size:3.1rem; color:#fbf3df; margin-bottom:6px;}
.start-box .sub{color:#c9d4e3; font-size:1.02rem; max-width:520px; margin:0 auto 26px;}
.start-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px;}
.btn{border-radius:10px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); padding:12px 22px; font-size:.92rem; font-weight:700; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;}
.btn:hover{transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,.28);}
.btn:active{transform:translateY(0) scale(.98);}
.btn.primary{background:var(--brass); border-color:var(--brass); color:#241c12; animation:shimmerGlow 2.6s ease-in-out infinite;}
.btn.primary:hover{background:#cf9c42;}
.btn.ghost{background:transparent; border:1px solid rgba(255,255,255,.4); color:#f3ead6;}
.btn.ghost:hover{background:rgba(255,255,255,.08);}
.btn.secondary{background:transparent; color:var(--ink); border:1px solid #b6a67f;}
.btn.secondary:hover{border-color:var(--ink); background:#fff8ea;}
.btn:disabled{opacity:.4; cursor:not-allowed; animation:none; transform:none; box-shadow:none;}
.btn.wide{width:100%;}
.lang-toggle{display:inline-flex; border:1px solid rgba(255,255,255,.4); border-radius:100px; overflow:hidden; margin-bottom:20px;}
.lang-toggle button{background:transparent; border:none; color:#e7ddc3; padding:6px 16px; font-size:.78rem; font-weight:700; letter-spacing:.03em; transition:background .15s;}
.lang-toggle button.active{background:var(--brass); color:#241c12;}
.start-credit{margin-top:34px; font-size:.72rem; color:#93a3ba; font-family:'JetBrains Mono',monospace;}

/* ===================== role screen ===================== */
#role-screen{min-height:100vh; background:radial-gradient(circle at 50% 0%,#8a2438,#150709 75%); color:#f3ead6; display:flex; align-items:center; justify-content:center; padding:30px;}
.role-wrap{max-width:760px; width:100%; text-align:center;}
.role-cards{display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-top:26px;}
.role-card{flex:1; min-width:260px; max-width:320px; background:rgba(255,250,240,.06); border:2px solid rgba(255,255,255,.18); border-radius:16px; padding:26px 20px; cursor:pointer; transition:transform .18s ease, border-color .18s ease, background .18s ease; text-align:left;}
.role-card:hover{transform:translateY(-4px) rotate(-.3deg); border-color:var(--brass-dim); background:rgba(255,250,240,.1);}
.role-card.selected{border-color:var(--brass); background:rgba(189,138,52,.16); box-shadow:0 0 0 3px rgba(189,138,52,.35);}
.role-card .emoji{font-size:2.6rem;}
.role-card h3{color:#fbf3df; margin-top:8px;}
.role-card p{color:#cfd8e6; font-size:.86rem;}
.diff-cards{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-top:22px;}
.diff-card{flex:1; min-width:240px; max-width:280px; background:rgba(255,250,240,.06); border:2px solid rgba(255,255,255,.18); border-radius:16px; padding:20px 18px; cursor:pointer; transition:transform .18s ease, border-color .18s ease, background .18s ease; text-align:left;}
.diff-card:hover{transform:translateY(-4px); border-color:var(--brass-dim); background:rgba(255,250,240,.1);}
.diff-card.selected{border-color:var(--brass); background:rgba(189,138,52,.16); box-shadow:0 0 0 3px rgba(189,138,52,.35);}
.diff-card .emoji{font-size:2rem;}
.diff-card h3{color:#fbf3df; margin:6px 0 2px; font-size:1.15rem;}
.diff-card p{color:#cfd8e6; font-size:.8rem; margin-bottom:10px;}
.diff-table{font-family:'JetBrains Mono',monospace; font-size:.72rem; color:#e7ddc3; border-top:1px solid rgba(255,255,255,.15); padding-top:8px;}
.diff-table div{display:flex; justify-content:space-between; margin-bottom:4px;}
.diff-table span{color:#f3ead6; font-weight:700;}

/* ===================== app shell ===================== */
#app{max-width:1220px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; position:relative;}
.topbar{background:var(--ink); color:var(--paper); padding:13px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; border-bottom:4px solid var(--brass);}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .brand .gearicon{display:inline-block; animation:spinSlow 12s linear infinite; font-size:1.3rem;}
.topbar .brand h1{font-size:1.18rem; color:var(--paper); margin:0;}
.topbar .brand span{font-size:.72rem; color:var(--brass-dim); font-family:'JetBrains Mono',monospace; display:block;}
.topbar .midchip{background:#2a221a; border:1px solid #4a3e2c; border-radius:100px; padding:6px 14px; font-size:.76rem; color:#e6d9b8; font-family:'JetBrains Mono',monospace;}
.topbar .icons{display:flex; gap:8px; align-items:center;}
.icon-btn{background:#241d15; border:1px solid #4a3e2c; color:var(--paper); width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:.95rem; transition:background .15s, transform .15s;}
.icon-btn:hover{background:#382c1e; transform:translateY(-1px);}
.lang-pill{display:inline-flex; border:1px solid #4a3e2c; border-radius:100px; overflow:hidden;}
.lang-pill button{background:#241d15; border:none; color:#c9bfa4; padding:6px 11px; font-size:.7rem; font-weight:700;}
.lang-pill button.active{background:var(--brass); color:#241c12;}
.role-badge{font-size:.7rem; background:#241d15; border:1px solid #4a3e2c; padding:6px 11px; border-radius:100px; color:var(--brass-dim);}

.layout{display:flex; flex:1; min-height:0;}
nav.side{width:196px; flex-shrink:0; background:var(--paper-dim); border-right:1px solid #d8c79c; padding:14px 10px;}
nav.side button.navitem{display:block; width:100%; text-align:left; background:transparent; border:none; border-radius:8px; padding:9px 10px; margin-bottom:4px; font-size:.83rem; color:#4a3c26; font-weight:600; transition:background .15s, transform .15s;}
nav.side button.navitem:hover:not(:disabled){background:#ddcda3; transform:translateX(2px);}
nav.side button.navitem.active{background:var(--ink); color:var(--paper);}
nav.side button.navitem:disabled{color:#b8a97e; cursor:not-allowed;}
nav.side .lv-num{display:inline-block; width:1.35em; font-family:'JetBrains Mono',monospace; opacity:.6;}
nav.side h4{font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:#8c7845; margin:16px 4px 6px;}
nav.side .side-btn{display:flex; align-items:center; gap:7px; width:100%; text-align:left; background:var(--card); border:1px solid #d8c79c; border-radius:8px; padding:9px 10px; margin-bottom:6px; font-size:.8rem; color:#4a3c26; font-weight:600; transition:transform .15s, border-color .15s;}
nav.side .side-btn:hover{transform:translateY(-1px); border-color:var(--brass);}
nav.side .footer-credit{margin-top:20px; font-size:.66rem; color:#9c8a5e; font-family:'JetBrains Mono',monospace; padding:0 4px;}

main{flex:1; min-width:0; padding:22px 26px 40px; overflow-y:auto;}

/* roadmap strip */
.roadmap{display:flex; align-items:center; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
.roadmap .node{width:30px; height:30px; border-radius:50%; background:#e2d3ab; border:2px solid #cbb883; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:#7a672f; transition:transform .15s;}
.roadmap .node.done{background:var(--good); border-color:var(--good); color:#fff;}
.roadmap .node.current{background:var(--brass); border-color:#a67623; color:#241c12; transform:scale(1.18); box-shadow:0 0 0 4px rgba(189,138,52,.25);}
.roadmap .bar{flex:1; height:3px; background:#d8c79c; min-width:10px;}
.roadmap .bar.done{background:var(--good);}

/* ===================== generic ui ===================== */
.card{background:var(--card); border:1px solid #e4d3a8; border-radius:13px; padding:18px 20px; margin-bottom:15px; transition:box-shadow .18s ease;}
.card.hoverable:hover{box-shadow:0 8px 20px rgba(80,60,20,.12); transform:translateY(-1px);}
.card h3{font-size:1.05rem;}
.row{display:flex; gap:16px; flex-wrap:wrap;}
.col{flex:1; min-width:220px;}

label{display:block; font-size:.79rem; color:#5a4726; margin-bottom:4px; font-weight:600;}
input[type=range]{width:100%; accent-color:var(--brass);}
.stepper-row{display:flex; gap:6px; margin-top:5px;}
.step-btn{width:30px; height:30px; border-radius:7px; border:1px solid #cdbb8b; background:var(--card); font-weight:800; font-size:1rem; line-height:1; color:var(--ink); transition:transform .12s ease, border-color .12s ease;}
.step-btn:hover{border-color:var(--brass); transform:translateY(-1px);}
.step-btn:active{transform:scale(.92);}
input[type=number]{width:100%; padding:7px 9px; border:1px solid #cdbb8b; border-radius:6px; font-family:'JetBrains Mono',monospace; background:#fffef9;}

.statgrid{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
.statbox{flex:1; min-width:190px; background:var(--card); border:1px solid #e4d3a8; border-radius:12px; padding:13px 15px;}
.statbox .sh{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.statbox .sh .lbl{font-size:.72rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:#6b5a34; display:flex; gap:6px; align-items:center;}
.statbox .sh .goal{font-size:.68rem; color:#9c8a5e;}
.statbox .val{font-family:'JetBrains Mono',monospace; font-size:1.4rem; font-weight:700;}
.statbox .val .of{font-size:.85rem; color:#9c8a5e; font-weight:500;}
.statbox .meter{height:8px; border-radius:5px; background:#e9dcbb; overflow:hidden; margin-top:7px;}
.statbox .meter i{display:block; height:100%; border-radius:5px; transition:width .55s ease;}
.statbox.brass .meter i{background:linear-gradient(90deg,var(--brass),#e2b45c);}
.statbox.indigo .meter i{background:linear-gradient(90deg,var(--indigo),#c65a6c);}
.statbox.rust .meter i{background:linear-gradient(90deg,var(--rust),#d97a52);}
.statbox.good .meter i{background:linear-gradient(90deg,var(--good),#78c184);}

.btn.small{padding:8px 14px; font-size:.82rem;}
.choicebtn{display:block; width:100%; text-align:left; background:var(--paper); border:1px solid #d8c79c; border-radius:9px; padding:11px 14px; margin-top:8px; font-size:.86rem; transition:transform .13s, border-color .13s, background .13s;}
.choicebtn:hover{border-color:var(--brass); background:#fbf1d9; transform:translateX(3px);}

/* W bar / labor bar */
.wbar{display:flex; height:44px; border-radius:9px; overflow:hidden; border:1px solid #d8c79c;}
.wbar div{display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:#fff; font-family:'JetBrains Mono',monospace; transition:width .5s ease;}
.wbar .c{background:#5d7699;}
.wbar .v{background:#4c8956;}
.wbar .m{background:var(--rust);}
.wlegend{display:flex; gap:16px; font-size:.74rem; margin-top:7px; color:#5a4726; flex-wrap:wrap;}
.wlegend span::before{content:"■ ";}
.wlegend .c::before{color:#5d7699;}
.wlegend .v::before{color:#4c8956;}
.wlegend .m::before{color:var(--rust);}

.laborbar{display:flex; height:34px; border-radius:7px; overflow:hidden; border:1px solid #d8c79c;}
.laborbar .t{background:#4c8956;}
.laborbar .t2{background:var(--rust);}
.laborbar div{display:flex; align-items:center; justify-content:center; color:#fff; font-size:.72rem; font-weight:700; transition:width .5s ease;}

/* role split panels */
.split{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
.panel{flex:1; min-width:250px; border-radius:13px; padding:17px 19px; transition:box-shadow .2s;}
.panel.capital{background:linear-gradient(155deg,#3a1420,#671626); color:#f7ecec; border:1px solid #7a2536;}
.panel.capital h3{color:var(--brass-dim);}
.panel.worker{background:linear-gradient(155deg,#3c2317,#5c3220); color:#f7ebe1; border:1px solid #6b3f2b;}
.panel.worker h3{color:#f0c3a5;}
.panel .k{font-size:.73rem; opacity:.78;}
.panel .v{font-family:'JetBrains Mono',monospace; font-size:1.12rem;}
.panel.you{box-shadow:0 0 0 3px rgba(189,138,52,.55);}
.panel .youtag{display:inline-block; background:var(--brass); color:#241c12; font-size:.63rem; font-weight:800; letter-spacing:.04em; padding:2px 8px; border-radius:100px; margin-bottom:6px;}
.meter{height:9px; border-radius:5px; background:rgba(255,255,255,.15); overflow:hidden; margin-top:4px;}
.meter i{display:block; height:100%; transition:width .5s ease;}
.panel.capital .meter i{background:var(--brass);}
.panel.worker .meter i{background:#f0c3a5;}

/* modal */
#overlay{position:fixed; inset:0; background:rgba(15,10,6,.74); display:none; align-items:center; justify-content:center; padding:20px; z-index:50;}
#overlay.show{display:flex;}
.modal{background:var(--card); border-radius:15px; max-width:540px; width:100%; padding:24px 26px; border-top:6px solid var(--brass); animation:popIn .18s ease-out; max-height:86vh; overflow-y:auto;}
.modal .tag{font-size:.7rem; color:var(--rust); font-weight:800; letter-spacing:.03em; margin-bottom:4px; text-transform:uppercase;}
.knowledge-note{margin-top:14px; background:#e7efe2; border:1px solid #c4d9bc; border-radius:10px; padding:12px 14px; font-size:.82rem; color:#31501f;}

#toast{position:fixed; bottom:20px; left:50%; background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:10px; font-size:.85rem; display:none; z-index:60; border-left:4px solid var(--brass); max-width:82%; animation:slideFade .2s ease-out;}
#toast.show{display:block;}

.pill{display:inline-block; padding:4px 11px; border-radius:100px; font-size:.71rem; font-weight:800; letter-spacing:.02em;}
.pill.win{background:var(--good-pale); color:#265c26;}
.pill.lose{background:var(--danger-pale); color:#7c2019;}
.pill.info{background:var(--indigo-pale); color:#671626;}

.quiz-opt{display:block; width:100%; text-align:left; background:var(--paper); border:1px solid #d8c79c; border-radius:9px; padding:10px 14px; margin-top:8px; font-size:.86rem; transition:transform .13s;}
.quiz-opt:hover{border-color:var(--brass); transform:translateX(3px);}
.quiz-opt.correct{background:var(--good-pale); border-color:#7ab26f;}
.quiz-opt.wrong{background:var(--danger-pale); border-color:#c9705d;}

hr.sep{border:none; border-top:1px solid #e4d3a8; margin:16px 0;}
.small{font-size:.79rem; color:#6b5a34;}
ul.tight{margin:4px 0; padding-left:18px;}
ul.tight li{margin-bottom:3px; font-size:.87rem;}

.confetti-layer{position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden;}
.confetti-piece{position:absolute; top:-10px; width:9px; height:14px; animation:confettiFall 2.1s ease-in forwards;}

.locked-card{opacity:.55;}
.result-art{display:flex; justify-content:center; margin:-6px 0 12px; animation:popIn .35s ease-out;}
.result-art svg{max-width:420px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));}
#arrive-fx{position:fixed; inset:0; background:var(--ink); z-index:99999; pointer-events:none; opacity:1; transition:opacity .5s ease;}
#arrive-fx.hide{opacity:0;}
.badge-pop{animation:badgeIn .3s ease-out;}

@media(max-width:820px){
  .layout{flex-direction:column;}
  nav.side{width:100%; padding:10px;}
  nav.side .side-list{display:flex; overflow-x:auto; gap:6px;}
  nav.side .side-list button{white-space:nowrap; width:auto;}
  nav.side h4, nav.side .footer-credit{display:none;}
  .start-box h1{font-size:2.1rem;}
}

.banner{margin:0 0 14px;border-radius:14px;overflow:hidden;border:1px solid #d8c79c;background:#efe3c4}
.banner svg{display:block;width:100%;height:auto}
.banner .cap{padding:9px 14px;font-size:.82rem;background:var(--card);border-top:1px solid #e4d3a8;color:#5a4726;line-height:1.5}
.ico{float:right;margin:-4px 0 6px 10px}
@keyframes sm{0%{transform:translateY(0);opacity:.7}100%{transform:translateY(-26px) scale(1.6);opacity:0}}
@keyframes belt{to{transform:translateX(-16px)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.sm{animation:sm 3s ease-out infinite}.belt{animation:belt 1s linear infinite}.bob{animation:bob 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.sm,.belt,.bob{animation:none}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:7px;border:1px solid #b99a55;background:linear-gradient(90deg,#bd8a34 var(--p,50%),#eadcb8 var(--p,50%));outline:none;cursor:pointer;touch-action:pan-y;margin:12px 0 4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff8ea;border:5px solid #9c6a1c;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:grab}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff8ea;border:5px solid #9c6a1c;cursor:grab}
input[type=range]:focus-visible{box-shadow:0 0 0 3px rgba(189,138,52,.45)}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes spr{to{transform:rotate(-360deg)}}@keyframes bv{to{stroke-dashoffset:-20}}
.spin,.spinr{transform-box:fill-box;transform-origin:center;animation:sp 9s linear infinite}.spinr{animation-name:spr}.wheel{animation-duration:1.1s}.beltv{animation:bv .8s linear infinite}
@media(prefers-reduced-motion:reduce){.spin,.spinr,.beltv{animation:none}}
#hero-art{max-width:540px;margin:0 auto 16px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.25);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.role-card .emoji svg{display:block;margin:0 auto 6px}
#story-screen{position:fixed;inset:0;z-index:80;overflow:auto;background:radial-gradient(circle at 50% 0%,#8a2438,#150709 75%);color:#f3ead6;align-items:center;justify-content:center;padding:24px}
#story-box{max-width:720px;width:100%;text-align:center;margin:auto}

/* ---------------- sound ---------------- */
let actx=null;
function blip(freq=520,dur=.07,type='sine'){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(.09, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function chime(){ blip(523,.1); setTimeout(()=>blip(659,.1),100); setTimeout(()=>blip(784,.12),200); setTimeout(()=>blip(1047,.28),320); }
function buzz(){ blip(220,.22,'sawtooth'); setTimeout(()=>blip(180,.22,'sawtooth'),160); setTimeout(()=>blip(130,.32,'sawtooth'),320); }
document.addEventListener('click', e=>{
  if(e.target.closest('button')) blip(420,.045);
}, true);

function confettiBurst(){
  const colors=['#bd8a34','#9c4227','#2f4260','#3f7d4c','#e8c988'];
  const layer=document.createElement('div');
  layer.className='confetti-layer';
  document.body.appendChild(layer);
  for(let i=0;i<46;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*.4)+'s';
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    layer.appendChild(p);
  }
  setTimeout(()=>layer.remove(),2600);
}

function toast(msg){

  t.textContent=msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),3400);

        <h3>${S.lang==='vi'?'Kế hoạch tháng':'Plan for month'} ${s.turn}</h3>
        <div class="row">
          <div class="col"><label>${S.lang==='vi'?'Số phụ tùng định gia công':'Parts to machine'}: <b>${s.bolts}</b></label>
            <input type="range" min="10" max="80" value="${s.bolts}" oninput="liveSet(this,'L1','bolts')" onchange="L1.set('bolts',+this.value)">${stepper('L1','bolts',1,10,80)}</div>
          <div class="col"><label>${S.lang==='vi'?'Giá bán mỗi phụ tùng':'Price per part'}: <b>$${s.price.toLocaleString('en-US')}</b></label>
            <input type="range" min="0.9" max="2.6" step="0.05" value="${s.price}" oninput="liveSet(this,'L1','price')" onchange="L1.set('price',+this.value)">${stepper('L1','price',0.05,0.9,2.6)}</div>
          <div class="col"><label>${S.lang==='vi'?'Mua sắt (kg, $4/kg)':'Buy iron (kg, $4/kg)'}: <b>${s.buyYarn}</b></label>
            <input type="range" min="0" max="25" value="${s.buyYarn}" oninput="liveSet(this,'L1','buyYarn')" onchange="L1.set('buyYarn',+this.value)">${stepper('L1','buyYarn',1,0,25)}</div>
        </div>
        <p class="small">${S.lang==='vi'?'1 phụ tùng cần khoảng 0,2kg sắt. Phụ tùng không bán hết coi như mất trắng (hàng tồn giảm giá trị).':'Each part needs about 0.2kg of iron. Unsold parts are a straight loss.'}</p>
        <button class="btn primary" onclick="L1.playTurn()">${S.lang==='vi'?'Tiến hành tháng':'Run month'} ${s.turn} →</button>
      </div>
      ${s.log.length? `<div class="card"><h3>${tr('logTitle')}</h3>${s.log.slice(-4).map(l=>`<p class="small">${l}</p>`).join('')}</div>`:''}
    `;
  }
  function set(k,v){ S.L1[k]=v; renderInto(); }
  function adjust(k,delta,min,max){ const s=S.L1; s[k]=Math.max(min,Math.min(max,s[k]+delta)); renderInto(); }

  function playTurn(){
    const s=ensure();
    const card=deck[Math.floor(Math.random()*deck.length)];
    openModal(`<div class="tag">${L(card.tag)} · ${tr('monthLbl')} ${s.turn}</div><h3>${L(card.title)}</h3><p>${L(card.desc)}</p>
      ${card.choices.map((c,i)=>`<button class="choicebtn" onclick="L1.resolve(${i})">${L(c.label)}</button>`).join('')}`);
    L1._card=card;
  }
  function resolve(i){
    const s=ensure(); const card=L1._card;
    const ctx={demandMult:1}; card.choices[i].effect(ctx); closeModal();
    const maxByYarn=Math.floor((s.yarn+s.buyYarn)/0.2);
    const actualBolts=Math.min(s.bolts, ctx.yarnCapCut?Math.floor(maxByYarn*0.6):maxByYarn);
    const price=ctx.priceOverride||s.price;
    let baseDemand=Math.max(10, Math.round(2*(30+(2.1-price)/0.05)));
    const demand=Math.round(baseDemand*(ctx.demandMult||1))+(ctx.demandBonus||0);
    const sold=Math.min(actualBolts,demand);
    const revenue=sold*price;
    const yarnCost=s.buyYarn*4*(ctx.yarnPriceMult||1);
    const living=20; const repair=ctx.repairCost||0;
    const net=revenue-yarnCost-living-repair;
    s.yarn=Math.max(0,(s.yarn+s.buyYarn)-actualBolts*0.2);
    s.money+=net;
    s.log.push(`${tr('monthLbl')} ${s.turn}: ${L(card.title)} → ${S.lang==='vi'?'gia công':'machined'} ${actualBolts}, ${S.lang==='vi'?'bán':'sold'} ${sold}, ${net>=0?(S.lang==='vi'?'lãi':'profit'):(S.lang==='vi'?'lỗ':'loss')} ${FMT(Math.abs(net))}.`);
    if(s.turn===1) unlock('hth');
    s.turn++;
    if(s.money<0 && s.turn<=4){ s.done=true; s.result='lose'; }
    else if(s.turn>s.maxTurn){ s.done=true; s.result=s.money>=DCFG().L1target?'win':'lose'; }
    renderInto();
    if(s.done){ s.result==='win' ? confettiBurst() : buzz(); }
  }
  function renderResult(s){
    if(s.result==='win'){
      return `${roadmap(1)}<div class="card">${winArt()}<div class="pill win badge-pop">${S.lang==='vi'?'QUA MÀN':'STAGE CLEARED'}</div>
      <h3>${S.lang==='vi'?'Bạn trụ vững 6 tháng, dư':'You survived 6 months with'} ${FMT(s.money)}</h3>
      <p>${S.lang==='vi'?'Bạn tự làm, tự bán, rồi lấy tiền mua lại thứ mình cần — công thức <b>H – T – H</b>: tiền chỉ là khâu trung gian, mục đích cuối cùng vẫn là giá trị sử dụng.':'You made, sold, and bought back what you needed — the <b>C – M – C</b> formula: money is just the middle step; the goal is still use-value.'}</p></div>${quiz()}`;
    }
    return `${roadmap(1)}<div class="card">${loseArt()}<div class="pill lose">${S.lang==='vi'?'CHƯA QUA':'NOT CLEARED'}</div>
    <h3>${S.lang==='vi'?'Hết vốn':'Ran out of money'}</h3><p class="small">${S.lang==='vi'?'Thường do giá bán quá thấp làm dư nhiều phụ tùng bị ế, hoặc gặp liên tiếp sự kiện bất lợi.':'Usually caused by too-low prices leaving too many unsold parts, or a run of unlucky events.'}</p>
    <button class="btn" onclick="L1.retry()">${tr('retry')}</button></div>`;
  }
  function retry(){ S.L1=null; renderInto(); }
  const quizQ=[
    {q:{vi:'Mục đích cuối cùng của việc mang phụ tùng ra chợ bán trong màn này là gì?',en:'What is the ultimate goal of selling parts at market in this stage?'},
     opts:[{vi:'Có tiền để làm giàu, tích luỹ tư bản',en:'Getting rich, accumulating capital'},{vi:'Đổi lấy thứ mình cần dùng — một dạng giá trị sử dụng khác',en:'Exchanging it for what you need — another use-value'},{vi:'Chiếm đoạt giá trị thặng dư của người khác',en:'Capturing someone else’s surplus value'}], correct:1},
    {q:{vi:'Vì sao màn 1 chưa có bóc lột dù bạn có lời?',en:'Why is there no exploitation here even when you profit?'},
     opts:[{vi:'Vì bạn bán giá rẻ',en:'Because you sell cheap'},{vi:'Vì bạn tự làm, tự hưởng toàn bộ thành quả, không ai làm thuê cho ai',en:'Because you do the work and keep all of it — no one is employed by anyone'},{vi:'Vì phụ tùng không phải hàng hoá',en:'Because a part is not a commodity'}], correct:1}
  ];
  function quiz(){
    return `<div class="card"><h3>${S.lang==='vi'?'Kiểm tra nhanh':'Quick check'}</h3>${quizQ.map((q,qi)=>`
      <div style="margin-bottom:14px;"><p><b>${qi+1}.</b> ${L(q.q)}</p>
      ${q.opts.map((o,oi)=>`<button class="quiz-opt" onclick="L1.answer(${qi},${oi})" id="l1-q${qi}-o${oi}">${L(o)}</button>`).join('')}</div>`).join('')}
      <button class="btn primary" onclick="L1.finish()">${S.lang==='vi'?'Sang màn 2':'Go to stage 2'} →</button></div>`;
  }
  function answer(qi,oi){
    const c=quizQ[qi].correct;
    document.getElementById(`l1-q${qi}-o${oi}`).classList.add(oi===c?'correct':'wrong');
    if(oi!==c) document.getElementById(`l1-q${qi}-o${c}`).classList.add('correct');
    oi===c?chime():buzz();
  }
  function finish(){ S.history.L1={money:S.L1.money}; unlockNext(2); goto('L2'); }
  return {render,set,adjust,playTurn,resolve,retry,answer,finish,_card:null};
})();

/* =========================================================
   MÀN 2 — TIỀN ĐẺ RA TIỀN? (T – H – T′)
   ========================================================= */
const L2 = (function(){
  const npcs=[
    {name:{vi:'Bác Sáu bán rau',en:'Old Mrs. Sau, veg seller'}, need:{vi:'cần tiền gấp',en:'needs cash urgently'}},

    {name:{vi:'Chú Tư xe kéo',en:'Mr. Tu, cart puller'}, need:{vi:'nghe tin đồn khan hàng',en:'heard rumours of a shortage'}},
    {name:{vi:'Anh Long thợ nề',en:'Long, a mason'}, need:{vi:'mua chịu, hẹn trả sau',en:'buying on credit'}},
    {name:{vi:'Bà Liên, chủ đại lý phụ tùng',en:'Mrs. Lien, parts dealer'}, need:{vi:'muốn nhập sỉ giá tốt',en:'wants a good wholesale price'}}
  ];
  function init(){ return {money:100, turn:1, maxTurn:5, marketValue:500, log:[], done:false}; }
  function ensure(){ if(!S.L2) S.L2=init(); return S.L2; }

  function render(){
    const s=ensure();
    if(s.done) return result(s);
    const npc=npcs[s.turn-1];
    return `${roadmap(2)}
    <div class="card hoverable">
      <h3>${S.lang==='vi'?'Màn 2 · Tiền đẻ ra tiền?':'Stage 2 · Money begets money?'}</h3>
      <p class="small">${S.lang==='vi'?'Giờ bạn dùng tiền để kiếm thêm tiền: mua phụ tùng rẻ, bán lại đắt hơn — <b>Tiền – Hàng – Tiền′</b>. Theo dõi ô "Tổng giá trị thị trường": nó có tăng theo lãi của bạn không?':'Now you use money to make more money: buy parts cheap, sell them dearer — <b>Money – Commodity – Money′</b>. Watch the "Total market value" box: does it grow along with your profit?'}</p>
    </div>
    <div class="statgrid">
      ${statHTML('brass','🪙', S.lang==='vi'?'Tiền của bạn':'Your money', FMT(s.money), null, null, Math.min(100,s.money/200*100))}
      ${statHTML('indigo','⚖️', S.lang==='vi'?'Tổng giá trị thị trường':'Total market value', FMT(s.marketValue), S.lang==='vi'?'(không đổi)':'(unchanged)', null, 100)}
    </div>
    <div class="card">
      <h3>${S.lang==='vi'?'Vòng':'Round'} ${s.turn}/5 — ${S.lang==='vi'?'gặp':'meeting'} ${L(npc.name)}</h3>
      <p class="small">${L(npc.name)} ${L(npc.need)}.</p>
      <div class="row">
        <button class="btn secondary" style="flex:1" onclick="L2.trade('cheap')">${S.lang==='vi'?'Mua rẻ – bán đắt':'Buy low – sell high'}</button>
        <button class="btn secondary" style="flex:1" onclick="L2.trade('fair')">${S.lang==='vi'?'Buôn bán ngang giá':'Trade at fair value'}</button>
        <button class="btn secondary" style="flex:1" onclick="L2.trade('spec')">${S.lang==='vi'?'Đầu cơ / cho vay':'Speculate / lend'}</button>
      </div>
    </div>
    ${s.log.length? `<div class="card"><h3>${tr('logTitle')}</h3>${s.log.slice(-4).map(l=>`<p class="small">${l}</p>`).join('')}</div>`:''}`;
  }
  function trade(mode){
    const s=ensure(); const npc=npcs[s.turn-1];
    let gain=0, note='';
    if(mode==='cheap'){ gain=6+Math.round(Math.random()*4);
      note=S.lang==='vi'?`Bạn lời ${FMT(gain)} vì ${L(npc.name)} chịu thiệt tương ứng — tổng giá trị thị trường không đổi.`:`You gained ${FMT(gain)} because ${L(npc.name)} lost the same amount — total market value unchanged.`;
    } else if(mode==='fair'){ gain=0.5;
      note=S.lang==='vi'?'Trao đổi ngang giá, gần như không ai lời.':'A fair trade — almost no one profits.';
    } else { gain=9+Math.round(Math.random()*5);
      note=S.lang==='vi'?`Bạn thu lời từ chênh lệch/lãi vay với ${L(npc.name)} — chỉ là phân phối lại của cải sẵn có.`:`You profited from the spread/interest with ${L(npc.name)} — just a redistribution of existing wealth.`;
    }
    s.money+=gain; s.log.push(`${S.lang==='vi'?'Vòng':'Round'} ${s.turn}: ${note}`);
    if(s.turn===2) unlock('thtprime');
    s.turn++;
    if(s.turn>s.maxTurn) s.done=true;
    renderInto();
  }
  function result(s){
    return `${roadmap(2)}<div class="card"><div class="pill info badge-pop">${S.lang==='vi'?'KẾT THÚC KHÁM PHÁ':'EXPLORATION DONE'}</div>
    <h3>${S.lang==='vi'?'Sau 5 vòng, bạn có':'After 5 rounds, you have'} ${FMT(s.money)}</h3>
    <p>${S.lang==='vi'?`Dù cách nào, tổng giá trị thị trường vẫn giữ nguyên ${FMT(s.marketValue)} — lưu thông không tự tạo ra giá trị mới, nó chỉ phân phối lại giá trị đã có.`:`Whichever way, total market value stayed at ${FMT(s.marketValue)} — circulation creates no new value, it only redistributes what already exists.`}</p>
    <p><b>${S.lang==='vi'?'Vậy T′ > T chỉ có thể đúng nếu có một hàng hoá đặc biệt: khi tiêu dùng nó, tạo ra giá trị mới lớn hơn giá trị của chính nó.':'So M′ > M only works if there is a special commodity: consuming it creates new value greater than its own value.'}</b></p></div>${quiz()}`;
  }
  const quizQ=[
    {q:{vi:'Nguồn gốc của giá trị thặng dư (m) nằm ở đâu?',en:'Where does surplus value (m) actually come from?'},
     opts:[{vi:'Ở sự khéo léo mua rẻ bán đắt',en:'Skill at buying low and selling high'},{vi:'Ở một hàng hoá đặc biệt — sức lao động — tạo ra giá trị mới lớn hơn giá trị của chính nó',en:'A special commodity — labour-power — that creates new value greater than its own'},{vi:'Ở việc in thêm tiền',en:'Printing more money'}], correct:1}
  ];
  function quiz(){
    return `<div class="card"><h3>${S.lang==='vi'?'Kiểm tra nhanh':'Quick check'}</h3>${quizQ.map((q,qi)=>`
      <div><p><b>${qi+1}.</b> ${L(q.q)}</p>${q.opts.map((o,oi)=>`<button class="quiz-opt" onclick="L2.answer(${qi},${oi})" id="l2-q${qi}-o${oi}">${L(o)}</button>`).join('')}</div>`).join('')}
      <button class="btn primary" onclick="L2.finish()">${S.lang==='vi'?'Sang màn 3':'Go to stage 3'} →</button></div>`;
  }
  function answer(qi,oi){ const c=quizQ[qi].correct; document.getElementById(`l2-q${qi}-o${oi}`).classList.add(oi===c?'correct':'wrong'); if(oi!==c) document.getElementById(`l2-q${qi}-o${c}`).classList.add('correct'); oi===c?chime():buzz(); }
  function finish(){ S.history.L2={money:S.L2.money}; unlockNext(3); goto('L3'); }
  return {render,trade,answer,finish};
})();

/* =========================================================
   MÀN 3 — VIỆC LÀM ĐẦU TIÊN
   ========================================================= */
const L3 = (function(){
  function initCap(){
    return {mode:'capital',
      candidates:[
        {id:'A', name:{vi:'Chị Lan',en:'Lan'}, story:{vi:'thợ cơ khí mất máy tiện vì xưởng lớn cạnh tranh',en:'a mechanic who lost her lathe to bigger workshops'}, needWage:23, hireable:true, skill:1},
        {id:'B', name:{vi:'Anh Dũng',en:'Dung'}, story:{vi:'nông dân mất đất canh tác, lên phố tìm việc',en:'a farmer who lost his land, come to the city'}, needWage:21, hireable:true, skill:.9},
        {id:'C', name:{vi:'Ông Bình',en:'Binh'}, story:{vi:'có máy tiện riêng, tự gia công tự bán, từ chối làm thuê',en:'owns his own lathe, machines and sells for himself, refuses to be hired'}, needWage:null, hireable:false, skill:1.2}
      ],
      baseline:20, discontent:20, offer:23, hired:null, turn:1, maxTurn:3, done:false, log:[]};
  }
  function initWork(){
    return {mode:'worker', baseline:20, endurance:70, turn:1, maxTurn:4, accepted:false, done:false, log:[],
      offers:[19.5,21.5,20.5,23.5]};
  }
  function ensure(){ if(!S.L3) S.L3 = S.role==='capital'?initCap():initWork(); return S.L3; }

  const deckShared=[
    {title:{vi:'Giá gạo & tiền trọ tăng',en:'Rice & rent prices rise'}, desc:{vi:'Chi phí sinh hoạt tối thiểu nhích lên.',en:'The minimum cost of living creeps up.'}, wage:1.5},
    {title:{vi:'Cần thêm tiền nuôi con nhỏ',en:'Needs more to raise a young child'}, desc:{vi:'Chi phí nuôi con khiến mức sống tối thiểu tăng.',en:'Childcare costs raise the minimum needed.'}, wage:1},
    {title:{vi:'Học thêm kỹ thuật tiện chính xác',en:'Learns precision-machining technique'}, desc:{vi:'Tay nghề khá hơn, lao động phức tạp hơn.',en:'Skill improves — more complex labour.'}, wage:0}
  ];

  function render(){
    const s=ensure();
    if(s.done) return result(s);
    return s.mode==='capital' ? renderCap(s) : renderWork(s);
  }

  function renderCap(s){
    return `${roadmap(3)}
    <div class="split">
      <div class="panel capital you"><span class="youtag">${S.lang==='vi'?'BẠN':'YOU'}</span>
        <h3>${S.lang==='vi'?'Góc chủ xưởng':'The owner’s desk'}</h3>
        <p class="k">${S.lang==='vi'?'Bạn là Yi Long Ma — cần tuyển thêm 1 thợ cho hãng Lesta đang mở rộng.':'You are Yi Long Ma — you need to hire one more mechanic for expanding Lesta.'}</p>
        <div class="k" style="margin-top:10px;">${S.lang==='vi'?'Giá trị sức lao động tối thiểu hiện nay':'Current minimum value of labour-power'}</div>
        <div class="v">${FMT(s.baseline)} / ${S.lang==='vi'?'ngày':'day'}</div>
        <div class="k" style="margin-top:10px;">${S.lang==='vi'?'Bất mãn thị trường lao động':'Labour-market discontent'}</div>
        <div class="meter"><i style="width:${Math.min(100,s.discontent)}%"></i></div>
      </div>
      <div class="panel worker">
        <h3>${S.lang==='vi'?'Góc người tìm việc':'The job seekers'}</h3>
        ${s.candidates.map(c=>`<div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.15);">
          <b>${L(c.name)}</b> — <span class="k">${L(c.story)}</span><br>
          ${c.hireable? `<span class="k">${S.lang==='vi'?'Cần tối thiểu':'Needs at least'} ~${FMT(c.needWage)}/${S.lang==='vi'?'ngày':'day'}, ${S.lang==='vi'?'tay nghề':'skill'} ×${c.skill.toFixed(2)}</span>`
            : `<span class="k">${S.lang==='vi'?'Không phải hàng hoá sức lao động — còn tư liệu sản xuất riêng.':'Not a labour-power commodity — still owns means of production.'}</span>`}
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3>${S.lang==='vi'?'Thương lượng — vòng':'Negotiation — round'} ${s.turn}/${s.maxTurn}</h3>
      <label>${S.lang==='vi'?'Đề nghị lương/ngày':'Wage offer per day'}: <b>$${s.offer.toLocaleString('en-US')}</b></label>
      <input type="range" min="15" max="32" step="0.5" value="${s.offer}" oninput="liveSet(this,'L3','offer')" onchange="L3.set('offer',+this.value)">${stepper('L3','offer',0.5,15,32)}
      <div class="row" style="margin-top:10px;">
        <button class="btn" onclick="L3.negotiate('A')">${S.lang==='vi'?'Đề nghị với':'Offer to'} ${L(s.candidates[0].name)}</button>
        <button class="btn" onclick="L3.negotiate('B')">${S.lang==='vi'?'Đề nghị với':'Offer to'} ${L(s.candidates[1].name)}</button>
        <button class="btn secondary" onclick="L3.tryC()">${S.lang==='vi'?'Thử mời':'Try to hire'} ${L(s.candidates[2].name)}</button>
      </div>
    </div>
    ${s.log.length? `<div class="card"><h3>${tr('logTitle')}</h3>${s.log.slice(-4).map(l=>`<p class="small">${l}</p>`).join('')}</div>`:''}`;
  }
  function set(k,v){ S.L3[k]=v; renderInto(); }
  function adjust(k,delta,min,max){ const s=S.L3; s[k]=Math.max(min,Math.min(max,s[k]+delta)); renderInto(); }
  function tryC(){
    const s=ensure();
    openModal(`<div class="tag">${S.lang==='vi'?'Vì sao không thuê được?':'Why can’t you hire him?'}</div><h3>${L(s.candidates[2].name)} ${S.lang==='vi'?'từ chối':'refuses'}</h3>
    <p>${S.lang==='vi'?'Ông Bình có máy tiện riêng — tự sản xuất, tự bán, không buộc phải bán sức lao động để sống. Sức lao động chỉ thành hàng hoá khi người lao động tự do về thân thể <b>và</b> không có tư liệu sản xuất. Ông Bình chỉ thoả điều kiện đầu.':'Binh owns his own lathe — he produces and sells for himself, not forced to sell his labour-power to survive. Labour-power becomes a commodity only when the worker is free <b>and</b> owns no means of production. Binh only meets the first condition.'}</p>
    <button class="btn wide" onclick="closeModal()">${S.lang==='vi'?'Đã hiểu':'Got it'}</button>`);
    unlock('laborcom');
  }
  function negotiate(id){
    const s=ensure(); const c=s.candidates.find(x=>x.id===id);
    const card=deckShared[Math.floor(Math.random()*deckShared.length)];
    s.baseline+=card.wage; closeModal();
    if(s.offer>=c.needWage){
      s.hired=c; s.discontent=Math.max(0,s.discontent-10);
      s.log.push(`${L(card.title)}. ${S.lang==='vi'?'Bạn thuê được':'You hired'} ${L(c.name)} — ${FMT(s.offer)}/${S.lang==='vi'?'ngày':'day'}.`);
      s.done=true;
    } else {
      s.discontent+=12;
      s.log.push(`${L(card.title)}. ${L(c.name)} ${S.lang==='vi'?'từ chối vì lương thấp hơn mức sống tối thiểu':'refuses — offer below minimum living cost'} (${FMT(c.needWage)}).`);
      s.turn++;
      if(s.turn>s.maxTurn||s.discontent>=50){ s.done=true; s.hired=null; }
    }
    renderInto();
    if(s.done) s.hired? confettiBurst() : buzz();
  }

  function renderWork(s){
    const offer=s.offers[s.turn-1];
    return `${roadmap(3)}
    <div class="split">
      <div class="panel worker you"><span class="youtag">${S.lang==='vi'?'BẠN':'YOU'}</span>
        <h3>${S.lang==='vi'?'Bạn — thợ cơ khí mất máy tiện':'You — a mechanic who lost your lathe'}</h3>
        <p class="k">${S.lang==='vi'?'Xưởng xe hơi lớn cạnh tranh khiến máy tiện riêng của bạn không còn sống nổi. Giờ bạn phải đi tìm việc làm thuê.':'Big workshops undercut your own lathe; you can no longer make a living from it. Now you must find waged work.'}</p>
        <div class="k" style="margin-top:10px;">${S.lang==='vi'?'Sức chịu đựng (còn trụ được bao lâu chưa có việc)':'Endurance (how long you can hold out unemployed)'}</div>
        <div class="meter"><i style="width:${Math.min(100,s.endurance)}%"></i></div>
      </div>
      <div class="panel capital">
        <h3>${S.lang==='vi'?'Yi Long Ma — chủ hãng Lesta':'Yi Long Ma — owner of Lesta'}</h3>
        <p class="k">${S.lang==='vi'?'Giá trị sức lao động tối thiểu để bạn sống':'Minimum value of your labour-power to live'}</p>
        <div class="v">${FMT(s.baseline)} / ${S.lang==='vi'?'ngày':'day'}</div>
      </div>
    </div>
    <div class="card">
      <h3>${S.lang==='vi'?'Lời mời — vòng':'Offer — round'} ${s.turn}/${s.maxTurn}</h3>
      <p>${S.lang==='vi'?'Chủ xưởng đề nghị':'The owner offers'}: <b>${FMT(offer)}/${S.lang==='vi'?'ngày':'day'}</b></p>
      <div class="row">
        <button class="btn primary" onclick="L3.workDecide('accept')">${S.lang==='vi'?'Chấp nhận':'Accept'}</button>
        <button class="btn secondary" onclick="L3.workDecide('negotiate')">${S.lang==='vi'?'Thương lượng đòi thêm':'Negotiate for more'}</button>
        <button class="btn secondary" onclick="L3.workDecide('reject')">${S.lang==='vi'?'Từ chối, chờ cơ hội khác':'Refuse, wait for another chance'}</button>
      </div>
    </div>
    ${s.log.length? `<div class="card"><h3>${tr('logTitle')}</h3>${s.log.slice(-4).map(l=>`<p class="small">${l}</p>`).join('')}</div>`:''}`;
  }
  function workDecide(choice){
    const s=ensure(); const offer=s.offers[s.turn-1];
    const card=deckShared[Math.floor(Math.random()*deckShared.length)];
    s.baseline+=card.wage;
    if(choice==='accept'){
      s.accepted = offer>=s.baseline ? 'fair' : 'below';
      s.finalWage=offer;
      s.log.push(`${L(card.title)}. ${S.lang==='vi'?'Bạn nhận việc với':'You took the job at'} ${FMT(offer)}/${S.lang==='vi'?'ngày':'day'}.`);
      s.done=true;
    } else if(choice==='negotiate'){
      const success = Math.random()<0.5;
      if(success){ s.offers[s.turn-1] = offer+2; s.log.push(S.lang==='vi'?'Thương lượng thành công, chủ xưởng nâng giá đề nghị.':'Negotiation worked — the owner raised the offer.'); }
      else { s.endurance-=8; s.log.push(S.lang==='vi'?'Chủ xưởng không nhượng bộ. Bạn mất thêm thời gian, sức chịu đựng giảm.':'The owner won’t budge. More time lost, endurance drops.'); s.turn++; }
    } else {
      s.endurance-=15;
      s.log.push(`${L(card.title)}. ${S.lang==='vi'?'Bạn từ chối, tiếp tục chờ.':'You refuse and keep waiting.'}`);
      s.turn++;
    }
    unlock('laborcom');
    if(s.endurance<=0 || s.turn>s.maxTurn){ s.done=true; if(!s.accepted) s.accepted='none'; }
    renderInto();
    if(s.done) s.accepted && s.accepted!=='none' ? confettiBurst() : buzz();
  }

  function result(s){
    if(s.mode==='capital'){
      if(s.hired){
        return `${roadmap(3)}<div class="card">${winArt()}<div class="pill win badge-pop">${S.lang==='vi'?'QUA MÀN':'STAGE CLEARED'}</div>
        <h3>${S.lang==='vi'?'Bạn đã thuê được':'You hired'} ${L(s.hired.name)}</h3>
        <p>${S.lang==='vi'?'Bạn trả đúng giá trị sức lao động — đủ để họ tái sản xuất sức lao động. Nhưng đây chỉ mua được quyền sử dụng sức lao động trong một ngày — phần giá trị nó thật sự tạo ra là câu chuyện của màn tiếp theo.':'You paid the value of labour-power — enough to reproduce it. But this only buys the right to use it for a day; what it actually creates is the next stage’s story.'}</p>
        <button class="btn primary" onclick="L3.finish()">${S.lang==='vi'?'Sang màn 4':'Go to stage 4'} →</button></div>`;
      }
      return `${roadmap(3)}<div class="card">${loseArt()}<div class="pill lose">${S.lang==='vi'?'CHƯA THUÊ ĐƯỢC':'NO ONE HIRED'}</div><h3>${S.lang==='vi'?'Không ai chấp nhận mức lương bạn đưa ra':'No one accepted your offer'}</h3>
      <button class="btn" onclick="L3.retry()">${tr('retry')}</button></div>`;
    } else {
      if(s.accepted && s.accepted!=='none'){
        return `${roadmap(3)}<div class="card">${winArt()}<div class="pill win badge-pop">${S.lang==='vi'?'QUA MÀN':'STAGE CLEARED'}</div>
        <h3>${S.lang==='vi'?'Bạn nhận việc với':'You took the job at'} ${FMT(s.finalWage)}/${S.lang==='vi'?'ngày':'day'}</h3>
        <p>${S.lang==='vi'?'Bạn tự do về thân thể, không còn máy tiện riêng nên buộc phải bán sức lao động để sống — đúng hai điều kiện khiến sức lao động thành hàng hoá.':'You are personally free, but you own no lathe, so you must sell your labour-power to live — exactly the two conditions that make labour-power a commodity.'}</p>
        <button class="btn primary" onclick="L3.finish()">${S.lang==='vi'?'Sang màn 4':'Go to stage 4'} →</button></div>`;
      }
      return `${roadmap(3)}<div class="card">${loseArt()}<div class="pill lose">${S.lang==='vi'?'KIỆT SỨC':'RAN OUT'}</div><h3>${S.lang==='vi'?'Sức chịu đựng cạn trước khi có việc':'Endurance ran out before finding work'}</h3>
      <button class="btn" onclick="L3.retry()">${tr('retry')}</button></div>`;
    }
  }
  function retry(){ S.L3=null; renderInto(); }
  function finish(){
    S.history.L3 = S.L3.mode==='capital' ? {hired:L(S.L3.hired?.name||{vi:'',en:''}), wage:S.L3.offer} : {hired:'you', wage:S.L3.finalWage};
    unlockNext(4); goto('L4');
  }
  return {render,set,adjust,negotiate,tryC,workDecide,retry,finish};
})();

/* =========================================================
   MÀN 4 — XƯỞNG Ô TÔ (c, v, m)
   ========================================================= */
const L4 = (function(){
  const VPH=5;
  function initCap(){ return {mode:'capital', capital:500, machines:1, workers:1, cottonKg:20, wage:23, turn:1, maxTurn:6, expDone:false, machineTestDone:false, hireTestDone:false, log:[], done:false}; }
  function initWork(){ return {mode:'worker', turn:1, maxTurn:6, health:70, wage:23, hoursExtra:0, machines:2, workers:3, cottonKg:20, log:[], done:false, infoSeen:{m:false,h:false}}; }
  function ensure(){ if(!S.L4) S.L4 = S.role==='capital'?initCap():initWork(); return S.L4; }

  const deckCap=[
    {title:{vi:'Máy tiện hỏng, phải thay',en:'A lathe breaks, must replace it'}, desc:{vi:'Một máy tiện cũ hỏng nặng.',en:'An old lathe fails badly.'}, effect:s=>{s.oneTimeC=(s.oneTimeC||0)+150;}},
    {title:{vi:'Mất điện nửa ngày',en:'Power cut for half a day'}, desc:{vi:'Xưởng ngừng vài giờ.',en:'The workshop halts for hours.'}, effect:s=>{s.outputMult=(s.outputMult||1)*0.85;}},
    {title:{vi:'Giá sắt giảm 15%',en:'Iron price drops 15%'}, desc:{vi:'Nguồn cung dồi dào.',en:'Supply is plentiful.'}, effect:s=>{s.cottonMult=(s.cottonMult||1)*0.85;}},
    {title:{vi:'Thợ cơ khí tay nghề cao xin nghỉ',en:'A skilled mechanic quits'}, desc:{vi:'Chuyển sang xưởng khác trả cao hơn.',en:'Moves to a workshop paying more.'}, effect:s=>{s.workers=Math.max(1,s.workers-1);}},
    {title:{vi:'Đơn hàng tăng mạnh',en:'Orders surge'}, desc:{vi:'Một đại lý xe hơi đặt số lượng lớn.',en:'A car dealership places a big order.'}, effect:s=>{s.outputMult=(s.outputMult||1)*1.2;}}
  ];
  const deckWork=[
    {title:{vi:'Chủ xưởng đề nghị tăng ca',en:'The owner asks for overtime'}, desc:{vi:'Đơn hàng gấp, cần thêm giờ.',en:'A rush order needs extra hours.'}},
    {title:{vi:'Máy tiện gần bạn kêu lạ',en:'The lathe next to you sounds off'}, desc:{vi:'Có thể mất an toàn nếu không báo cáo.',en:'Could be unsafe if unreported.'}},
    {title:{vi:'Đồng nghiệp rủ xin tăng lương',en:'A coworker suggests asking for a raise'}, desc:{vi:'Cùng nhau đề nghị chủ xưởng.',en:'Approach the owner together.'}},
    {title:{vi:'Tai nạn suýt xảy ra',en:'A near-miss on the floor'}, desc:{vi:'Dây curoa lỏng, suýt cuốn tay một đồng nghiệp.',en:'A loose belt nearly catches a coworker’s hand.'}},
    {title:{vi:'Ca đêm bất ngờ',en:'A surprise night shift'}, desc:{vi:'Chủ xưởng muốn chạy máy suốt đêm để kịp đơn.',en:'The owner wants the machines running all night for a deadline.'}},
    {title:{vi:'Thợ học việc mới vào',en:'New apprentices arrive'}, desc:{vi:'Chủ thuê người lương rẻ hơn — bạn lo bị thay thế.',en:'Cheaper apprentices are hired — you worry about being replaced.'}}
  ];

  function computeWvm(workers,machines,wage,cottonKg,extraHours){
    const c = machines*25 + cottonKg*workers*3.5;
    const v = workers*wage;
    const mHours = 4 + (extraHours||0);
    const m = workers*mHours*VPH;
    return {c,v,m,W:c+v+m,mHours};
  }

  function render(){
    const s=ensure();
    if(s.done) return result(s);
    return s.mode==='capital' ? renderCap(s) : renderWork(s);
  }

  function renderCap(s){
    const {c,v,m,W}=computeWvm(s.workers,s.machines,s.wage,s.cottonKg,0);
    const mRate=v>0?Math.round(m/v*100):0, pRate=(c+v)>0?Math.round(m/(c+v)*100):0;
    return `${roadmap(4)}
    <div class="split">
      <div class="panel capital you"><span class="youtag">${S.lang==='vi'?'BẠN':'YOU'}</span>
        <h3>${S.lang==='vi'?'Sổ sách chủ xưởng':'Owner’s ledger'}</h3>
        <div class="k">${S.lang==='vi'?'Vốn hiện có':'Current capital'}</div><div class="v">${FMT(s.capital)}</div>
        <div class="k" style="margin-top:8px;">m′</div><div class="v">${mRate}%</div>
        <div class="k" style="margin-top:8px;">p′</div><div class="v">${pRate}%</div>
      </div>
      <div class="panel worker">
        <h3>${S.lang==='vi'?'Trạng thái thợ cơ khí':'Mechanics’ status'}</h3>
        <div class="k">${S.lang==='vi'?'Số công nhân':'Workers'}</div><div class="v">${s.workers}</div>
        <div class="laborbar" style="margin-top:8px;"><div class="t" style="width:50%">t = 4h</div><div class="t2" style="width:50%">t′ = 4h</div></div>
      </div>
    </div>
    <div class="card"><h3>W = c + v + m</h3>
      <div class="wbar"><div class="c" style="width:${Math.max(6,c/W*100)}%">c</div><div class="v" style="width:${Math.max(6,v/W*100)}%">v</div><div class="m" style="width:${Math.max(6,m/W*100)}%">m</div></div>
      <div class="wlegend"><span class="c">c = ${FMT(c)}</span><span class="v">v = ${FMT(v)}</span><span class="m">m = ${FMT(m)}</span></div>
    </div>
    ${!s.expDone?experimentCap(s):''}
    <div class="card">
      <h3>${S.lang==='vi'?'Quyết định tháng':'Decisions for month'} ${s.turn}</h3>
      <div class="row">
        <div class="col"><label>${S.lang==='vi'?'Số máy tiện':'Lathes'}: <b>${s.machines}</b></label><input type="range" min="1" max="6" value="${s.machines}" oninput="liveSet(this,'L4','machines')" onchange="L4.set('machines',+this.value)">${stepper('L4','machines',1,1,6)}</div>
        <div class="col"><label>${S.lang==='vi'?'Số công nhân':'Workers'}: <b>${s.workers}</b></label><input type="range" min="1" max="6" value="${s.workers}" oninput="liveSet(this,'L4','workers')" onchange="L4.set('workers',+this.value)">${stepper('L4','workers',1,1,6)}</div>
        <div class="col"><label>${S.lang==='vi'?'Lương/ngày':'Wage/day'}: <b>$${s.wage.toLocaleString('en-US')}</b></label><input type="range" min="18" max="32" step="0.5" value="${s.wage}" oninput="liveSet(this,'L4','wage')" onchange="L4.set('wage',+this.value)">${stepper('L4','wage',0.5,18,32)}</div>
      </div>
      <button class="btn primary" style="margin-top:10px;" onclick="L4.playTurn()">${S.lang==='vi'?'Tiến hành tháng':'Run month'} ${s.turn} →</button>
    </div>
    ${s.log.length? `<div class="card"><h3>${tr('logTitle')}</h3>${s.log.slice(-4).map(l=>`<p class="small">${l}</p>`).join('')}</div>`:''}`;
  }
  function experimentCap(s){
    return `<div class="card" style="border-left:4px solid var(--brass);">
      <h3>${S.lang==='vi'?'Thí nghiệm bắt buộc':'Required experiment'}</h3>
      <div class="row">
        <button class="btn secondary" ${s.machineTestDone?'disabled':''} onclick="L4.testMachine()">${S.lang==='vi'?'1) Chỉ mua thêm 2 máy tiện':'1) Only buy 2 more lathes'}</button>
        <button class="btn secondary" ${s.hireTestDone?'disabled':''} onclick="L4.testHire()">${S.lang==='vi'?'2) Chỉ thuê thêm 1 công nhân':'2) Only hire 1 more worker'}</button>
      </div>
    </div>`;
  }
  function testMachine(){
    const s=ensure();
    const before=computeWvm(s.workers,s.machines,s.wage,s.cottonKg,0), after=computeWvm(s.workers,s.machines+2,s.wage,s.cottonKg,0);
    openModal(`<div class="tag">${S.lang==='vi'?'Thí nghiệm 1':'Experiment 1'}</div><h3>${S.lang==='vi'?'Thêm 2 máy tiện, không thuê thêm ai':'Add 2 lathes, no new hires'}</h3>
    <p>m: <b>${FMT(before.m)}</b> → <b>${FMT(after.m)}</b>. ${after.m===before.m?(S.lang==='vi'?'Không đổi — máy chỉ làm c tăng.':'Unchanged — machines only raise c.'):''}</p>
    <button class="btn wide" onclick="closeModal()">${S.lang==='vi'?'Ghi nhận':'Noted'}</button>`);
    s.machineTestDone=true; if(s.machineTestDone&&s.hireTestDone){s.expDone=true; unlock('cvm');} renderInto();
  }
  function testHire(){
    const s=ensure();
    const before=computeWvm(s.workers,s.machines,s.wage,s.cottonKg,0), after=computeWvm(s.workers+1,s.machines,s.wage,s.cottonKg,0);
    openModal(`<div class="tag">${S.lang==='vi'?'Thí nghiệm 2':'Experiment 2'}</div><h3>${S.lang==='vi'?'Thuê thêm 1 công nhân, giữ nguyên số máy tiện':'Hire 1 more worker, same lathes'}</h3>
    <p>m: <b>${FMT(before.m)}</b> → <b>${FMT(after.m)}</b>. ${after.m>before.m?(S.lang==='vi'?'Tăng! Lao động sống làm m tăng.':'It rises! Living labour is what grows m.'):''}</p>
    <button class="btn wide" onclick="closeModal()">${S.lang==='vi'?'Ghi nhận':'Noted'}</button>`);
    s.hireTestDone=true; if(s.machineTestDone&&s.hireTestDone){s.expDone=true; unlock('cvm');} renderInto();
  }
  function set(k,v){ S.L4[k]=v; renderInto(); }
  function adjust(k,delta,min,max){ const s=S.L4; s[k]=Math.max(min,Math.min(max,s[k]+delta)); renderInto(); }
  function playTurn(){
    const s=ensure();
    const card=deckCap[Math.floor(Math.random()*deckCap.length)];
    openModal(`<div class="tag">${tr('monthLbl')} ${s.turn}</div><h3>${L(card.title)}</h3><p>${L(card.desc)}</p>
      <button class="choicebtn" onclick="L4.resolve('safe')">${S.lang==='vi'?'🛡️ An toàn: giữ nhịp bình thường':'🛡️ Safe: keep the normal pace'}</button><button class="choicebtn" onclick="L4.resolve('push')">${S.lang==='vi'?'🚀 Tăng tốc: +15% sản lượng, 30% nguy cơ tai nạn (−$60)':'🚀 Push: +15% output, 30% accident risk (−$60)'}</button>`);
    L4._card=card;
  }
  function resolve(mode){
    const s=ensure(); const card=L4._card;
    s.outputMult=1; s.cottonMult=1; s.oneTimeC=0; card.effect(s); closeModal(); if(mode==='push'){ s.outputMult*=1.15; if(Math.random()<.3){ s.oneTimeC+=60; toast(S.lang==='vi'?'⚠️ Tai nạn trong xưởng! Tốn $60 bồi thường và sửa chữa.':'⚠️ Accident on the floor! $60 in compensation and repairs.'); } }
    const {c:baseC,v,m,W}=computeWvm(s.workers,s.machines,s.wage,s.cottonKg,0);
    const c=baseC*(s.cottonMult||1)+(s.oneTimeC||0);
    const revenue=(c+v+m)*(s.outputMult||1)*1.05;
    const net=revenue-(c+v);
    s.capital+=net; unlock('rate');
    s.log.push(`${tr('monthLbl')} ${s.turn}: ${L(card.title)}. m′=${v>0?Math.round(m/v*100):0}% → ${net>=0?(S.lang==='vi'?'lãi':'profit'):(S.lang==='vi'?'lỗ':'loss')} ${FMT(Math.abs(net))}.`);
    s.turn++;
    s.negStreak = net<0 ? (s.negStreak||0)+1 : 0;
    if(s.negStreak>=2){ s.done=true; s.result='lose'; }
    else if(s.turn>s.maxTurn){
      const {v:v2,m:m2}=computeWvm(s.workers,s.machines,s.wage,s.cottonKg,0);
      const mRate=v2>0?m2/v2*100:0;
      s.done=true; s.result=(mRate>=DCFG().L4mrate&&s.capital>=DCFG().L4target)?'win':'lose';
    }
    renderInto();
    if(s.done) s.result==='win'?confettiBurst():buzz();
  }

  function renderWork(s){
    const {c,v,m,W,mHours}=computeWvm(s.workers,s.machines,s.wage,s.cottonKg,s.hoursExtra);
    const mRate=v>0?Math.round(m/v*100):0;
    return `${roadmap(4)}
    <div class="split">
      <div class="panel worker you"><span class="youtag">${S.lang==='vi'?'BẠN':'YOU'}</span>
        <h3>${S.lang==='vi'?'Bạn — thợ cơ khí':'You — a mechanic'}</h3>
        <div class="k">${S.lang==='vi'?'Sức khoẻ':'Health'}</div><div class="meter"><i style="width:${s.health}%"></i></div>
        <div class="k" style="margin-top:8px;">${S.lang==='vi'?'Lương/ngày':'Wage/day'}</div><div class="v">${FMT(s.wage)}</div>
      </div>
      <div class="panel capital">
        <h3>${S.lang==='vi'?'Sổ sách xưởng (bạn nhìn thấy)':'The workshop’s ledger (you can see it)'}</h3>
        <div class="k">m′ ${S.lang==='vi'?'hiện nay':'right now'}</div><div class="v">${mRate}%</div>
        <div class="laborbar" style="margin-top:8px;"><div class="t" style="width:${4/(4+mHours)*100}%">t=4h</div><div class="t2" style="width:${mHours/(4+mHours)*100}%">t′=${mHours}h</div></div>
      </div>
    </div>
    <div class="card"><h3>W = c + v + m ${S.lang==='vi'?'của cả xưởng':'for the whole workshop'}</h3>
      <div class="wbar"><div class="c" style="width:${Math.max(6,c/W*100)}%">c</div><div class="v" style="width:${Math.max(6,v/W*100)}%">v</div><div class="m" style="width:${Math.max(6,m/W*100)}%">m</div></div>
      <div class="wlegend"><span class="c">c = ${FMT(c)}</span><span class="v">v = ${FMT(v)}</span><span class="m">m = ${FMT(m)}</span></div>
    </div>
    <div class="card">
      <h3>${tr('monthLbl')} ${s.turn}/${s.maxTurn}</h3>
      <p><b>${deckWork[(s.turn-1)%deckWork.length] ? L(deckWork[(s.turn-1)%deckWork.length].title):''}</b> — ${deckWork[(s.turn-1)%deckWork.length]?L(deckWork[(s.turn-1)%deckWork.length].desc):''}</p>
      <div class="row">
        <button class="btn secondary" onclick="L4.workTurn('overtime')">${S.lang==='vi'?'Nhận tăng ca (+2h, thêm thu nhập)':'Accept overtime (+2h, more pay)'}</button>

      return `${roadmap(5)}<div class="card"><div class="pill info">${S.lang==='vi'?'CHƯA TRỌN VẸN':'INCOMPLETE'}</div><h3>${S.lang==='vi'?'Sức khoẻ TB':'Avg health'} ${avg}, ${S.lang==='vi'?'bất mãn':'discontent'} ${s.discontent}</h3><button class="btn primary" onclick="L5.finish()">${S.lang==='vi'?'Sang màn 6':'Go to stage 6'} →</button> <button class="btn secondary" onclick="L5.retry()">${tr('retry')}</button></div>`;
    } else {
      if(s.result==='win'||s.result==='partial') return `${roadmap(5)}<div class="card">${s.result==='win'?winArt():''}<div class="pill ${s.result==='win'?'win badge-pop':'info'}">${s.result==='win'?(S.lang==='vi'?'QUA MÀN':'STAGE CLEARED'):(S.lang==='vi'?'HOÀN THÀNH':'FINISHED')}</div><h3>${S.lang==='vi'?'Bạn đã sống qua cả ba kiểu tăng thặng dư từ phía người lao động':'You lived through all three kinds of rising surplus from the worker’s side'}</h3><button class="btn primary" onclick="L5.finish()">${S.lang==='vi'?'Sang màn 6':'Go to stage 6'} →</button></div>`;
      return `${roadmap(5)}<div class="card">${loseArt()}<div class="pill lose">${S.lang==='vi'?'KIỆT SỨC':'BURNOUT'}</div><h3>${S.lang==='vi'?'Sức khoẻ xuống quá thấp':'Health dropped too low'}</h3><button class="btn" onclick="L5.retry()">${tr('retry')}</button></div>`;
    }
  }
  function retry(){ S.L5=null; renderInto(); }
  function finish(){
    S.history.L5 = S.L5.mode==='capital' ? {usedAbsolute:S.L5.usedAbsolute,usedRelative:S.L5.usedRelative,usedSuper:S.L5.usedSuper,discontent:S.L5.discontent} : {usedAbsolute:S.L5.sawAbsolute,usedRelative:S.L5.sawRelative,usedSuper:S.L5.sawSuper,discontent:S.L5.discontent};
    unlockNext(6); goto('L6');
  }
  return {render,apply,workReact,retry,finish};
})();

/* =========================================================
   MÀN 6 — PHIÊN TOÀ
   ========================================================= */
const L6 = (function(){
  const witnesses=[
    {id:'capital', side:{vi:'Nhà tư bản (chủ xưởng)',en:'The capitalist (workshop owner)'}, claim:{vi:'"Tôi bỏ vốn mua máy, nguyên liệu, chịu rủi ro phá sản, quản lý cả xưởng — lợi nhuận là phần thưởng chính đáng."',en:'"I put up the capital, bear the risk of bankruptcy, manage the whole workshop — profit is a fair reward."'}, correct:'weak', rebuttal:{vi:'Máy móc và nguyên liệu (c) chỉ chuyển nguyên giá trị sẵn có vào sản phẩm, không tự sinh thêm — rủi ro và quản lý là có thật, nhưng không phải nguồn tạo ra m.',en:'Machines and materials (c) only transfer their existing value into the product — real risk and management, but not the source of m.'}},
    {id:'worker', side:{vi:'Người thợ cơ khí',en:'The mechanic'}, claim:{vi:'"Tôi được trả đúng như thoả thuận — nhưng tôi làm ra nhiều giá trị hơn số tiền lương tôi nhận."',en:'"I’m paid exactly as agreed — but I create more value than the wage I receive."'}, correct:'strong', rebuttal:{vi:'Đúng với dữ liệu bạn thu thập: lương trả đúng giá trị sức lao động, nhưng giá trị sử dụng của nó khi làm việc lớn hơn giá trị của bản thân nó.',en:'Matches your own data: the wage equals the value of labour-power, but its use-value when working exceeds its own value.'}},
    {id:'market', side:{vi:'Nhà kinh tế thị trường',en:'The market economist'}, claim:{vi:'"Lợi nhuận là phần thưởng cho vốn, rủi ro, và đổi mới sáng tạo."',en:'"Profit rewards capital, risk, and innovation."'}, correct:'partial', rebuttal:{vi:'Đổi mới tạo lợi thế cạnh tranh tạm thời (siêu ngạch), nhưng không giải thích được nguồn m ổn định, lâu dài.',en:'Innovation does yield a temporary edge (super surplus), but doesn’t explain a stable, ongoing source of m.'}},
    {id:'marxist', side:{vi:'Nhà kinh tế Mác-xít',en:'The Marxist economist'}, claim:{vi:'"Trao đổi vẫn ngang giá, hợp đồng tự nguyện — nhưng bản chất là bóc lột vì m do lao động sống tạo ra bị chiếm hữu nhờ sở hữu tư liệu sản xuất."',en:'"The exchange is still equal, the contract voluntary — but it is exploitation in essence, because m created by living labour is captured through ownership of the means of production."'}, correct:'strong', rebuttal:{vi:'Khớp với toàn bộ dữ liệu bạn thu thập từ màn 1 đến 5.',en:'Matches all the data you gathered from stages 1 to 5.'}}
  ];
  const surpriseQ=[
    {q:{vi:'"Nếu chủ xưởng tự làm quản lý và tự trả lương quản lý cho mình thì sao?"',en:'"What if the owner does the managing and pays himself a manager’s wage?"'},
     opts:[{vi:'Khi đó không còn bóc lột',en:'Then there is no more exploitation'},{vi:'Lương quản lý trả cho công việc quản lý thật; m từ công nhân làm thuê vẫn song song tồn tại',en:'The manager’s wage pays for real managing work; m from hired workers still exists alongside it'},{vi:'Lợi nhuận biến thành 0',en:'Profit becomes zero'}], correct:1},
    {q:{vi:'"Nếu tăng lương gấp đôi thì có hết bóc lột không?"',en:'"Would doubling wages end exploitation?"'},
     opts:[{vi:'Có, vì lương đã cao',en:'Yes, since pay is now high'},{vi:'Chưa chắc — còn m nếu vẫn còn t′ mà giá trị đó không thuộc về người lao động',en:'Not necessarily — m persists if t′ still exists and that value still isn’t the worker’s'},{vi:'Không liên quan đến bóc lột',en:'Unrelated to exploitation'}], correct:1}
  ];
  function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
  function init(){ return {order:shuffle(witnesses.map(w=>w.id)), idx:0, score:0, phase:'witness', surprise:null, done:false}; }
  function ensure(){ if(!S.L6) S.L6=init(); return S.L6; }

  function render(){
    const s=ensure();
    if(s.done) return finalCard(s);
    if(s.phase==='surprise') return surpriseCard(s);
    if(s.idx>=s.order.length){ s.phase='surprise'; s.surprise=surpriseQ[Math.floor(Math.random()*surpriseQ.length)]; return surpriseCard(s); }
    const w=witnesses.find(x=>x.id===s.order[s.idx]);
    const roleLine = S.role==='capital' ? (S.lang==='vi'?'Là chủ xưởng vừa trải qua hành trình trên, bạn ngồi nghe từng lời khai.':'As the owner who just lived through everything above, you sit and hear each testimony.') : (S.lang==='vi'?'Là thợ cơ khí vừa trải qua hành trình trên, bạn ngồi nghe từng lời khai.':'As the mechanic who just lived through everything above, you sit and hear each testimony.');
    return `${roadmap(6)}
    <div class="card" style="background:#efe4c6; border-color:#d6bf85;">
      <h3>${S.lang==='vi'?'Phiên toà: Hợp tác hay bóc lột?':'Tribunal: Cooperation or exploitation?'}</h3>
      <p class="small">${roleLine}</p>
    </div>
    <div class="card hoverable">
      <div class="pill info">${S.lang==='vi'?'Nhân chứng':'Witness'} ${s.idx+1}/4</div>
      <h3>${L(w.side)}</h3><p style="font-style:italic;">${L(w.claim)}</p>
      <div class="row" style="margin-top:10px;">
        <button class="btn secondary" onclick="L6.judge('${w.id}','stand')">${S.lang==='vi'?'Lập luận này đứng vững':'This argument holds up'}</button>
        <button class="btn secondary" onclick="L6.judge('${w.id}','fail')">${S.lang==='vi'?'Chưa đủ căn cứ':'Not enough grounds'}</button>
      </div>
    </div>
    ${caseFile()}`;
  }
  function caseFile(){
    const h4=S.history.L4;
    return `<div class="card"><h3>${S.lang==='vi'?'Hồ sơ vụ án':'Case file'}</h3><ul class="tight">
      <li>${S.lang==='vi'?'Màn 1':'Stage 1'}: ${S.history.L1?FMT(S.history.L1.money):'—'}</li>
      <li>${S.lang==='vi'?'Màn 3':'Stage 3'}: ${S.history.L3?FMT(S.history.L3.wage)+'/'+(S.lang==='vi'?'ngày':'day'):'—'}</li>
      <li>${S.lang==='vi'?'Màn 4':'Stage 4'}: c=${h4?FMT(h4.c):'—'}, v=${h4?FMT(h4.v):'—'}, m=${h4?FMT(h4.m):'—'}, m′=${h4?h4.mRate+'%':'—'}</li>
      <li>${S.lang==='vi'?'Màn 5 — thử đủ 3 cách':'Stage 5 — tried all 3 methods'}: ${S.history.L5?(S.history.L5.usedAbsolute&&S.history.L5.usedRelative&&S.history.L5.usedSuper?(S.lang==='vi'?'có':'yes'):(S.lang==='vi'?'chưa đủ':'not quite')):'—'}</li>
    </ul></div>`;
  }
  function judge(id,choice){
    const s=ensure(); const w=witnesses.find(x=>x.id===id);
    const ok=(choice==='stand'&&(w.correct==='strong'||w.correct==='partial'))||(choice==='fail'&&w.correct==='weak');
    if(ok){s.score++; chime();} else buzz();
    openModal(`<div class="tag">${ok?(S.lang==='vi'?'Phán quyết hợp lý':'Sound judgement'):(S.lang==='vi'?'Cần xem lại':'Worth reconsidering')}</div><h3>${L(w.side)}</h3><p>${L(w.rebuttal)}</p>
      <button class="btn wide" onclick="L6.nextWitness()">${S.lang==='vi'?'Nhân chứng tiếp theo':'Next witness'}</button>`);
  }
  function nextWitness(){ closeModal(); const s=ensure(); s.idx++; renderInto(); }
  function surpriseCard(s){
    const q=s.surprise;
    return `${roadmap(6)}<div class="card"><div class="pill info">${S.lang==='vi'?'Câu hỏi bất ngờ từ khán giả':'A surprise question from the gallery'}</div><h3>${L(q.q)}</h3>
      ${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="L6.answerSurprise(${i})" id="l6s-${i}">${L(o)}</button>`).join('')}</div>`;
  }
  function answerSurprise(i){
    const s=ensure(); const q=s.surprise;
    document.getElementById(`l6s-${i}`).classList.add(i===q.correct?'correct':'wrong');
    if(i!==q.correct) document.getElementById(`l6s-${q.correct}`).classList.add('correct');
    if(i===q.correct){ s.score++; chime(); } else buzz();
    setTimeout(()=>{ s.done=true; renderInto(); if(s.score>=DCFG().L6score) confettiBurst(); }, 1300);
  }
  function finalCard(s){
    const win=s.score>=DCFG().L6score;
    return `${roadmap(6)}<div class="card">${win?winArt():''}<div class="pill ${win?'win badge-pop':'info'}">${win?(S.lang==='vi'?'HỒ SƠ ĐỦ CĂN CỨ':'CASE FILE COMPLETE'):(S.lang==='vi'?'HỒ SƠ CHƯA ĐỦ':'CASE FILE INCOMPLETE')}</div>
      <h3>${S.lang==='vi'?'Điểm vận dụng':'Applied score'}: ${s.score}/5</h3></div>
    <div class="card" style="border-left:5px solid var(--rust);">
      <h3>${S.lang==='vi'?'Kết luận':'Conclusion'}</h3>
      <p><b>${S.lang==='vi'?'Về hình thức':'In form'}:</b> ${S.lang==='vi'?'quan hệ chủ xưởng – thợ cơ khí là hợp tác tự nguyện, bình đẳng trước pháp luật, trao đổi ngang giá.':'the owner–mechanic relation is voluntary cooperation, equal before the law, an exchange at value.'}</p>
      <p><b>${S.lang==='vi'?'Về bản chất':'In essence'}</b> (${S.lang==='vi'?'theo KTCT Mác-Lênin':'per Marxist political economy'}): ${S.lang==='vi'?'vẫn là quan hệ bóc lột giá trị thặng dư — người thợ cơ khí lao động t′ mà giá trị đó không thuộc về họ, do nhà tư bản sở hữu tư liệu sản xuất.':'it remains a relation of surplus-value exploitation — the mechanic labours t′, but that value is not theirs, because the capitalist owns the means of production.'}</p>
      <div class="knowledge-note"><b>${S.lang==='vi'?'Ghi chú cân bằng':'Balance note'}:</b> ${S.lang==='vi'?'các trường phái khác coi lợi nhuận là phần thưởng chính đáng cho vốn, rủi ro, đổi mới. Ở Việt Nam hiện nay kinh tế tư nhân được thừa nhận và khuyến khích; vấn đề là điều tiết hợp lý và bảo vệ quyền lợi người lao động.':'other schools see profit as a fair reward for capital, risk and innovation. In Vietnam today private enterprise is recognised and encouraged; the real question is sensible regulation and protecting workers’ rights.'}</div>
    </div>
    ${!win?`<div class="card"><button class="btn" onclick="L6.retry()">${S.lang==='vi'?'Xem lại các màn để bổ sung hồ sơ':'Revisit earlier stages to build a stronger case'}</button></div>`:''}
    <div class="card"><button class="btn secondary" onclick="L6.restartGame()">${S.lang==='vi'?'Chơi lại toàn bộ':'Play again from the start'}</button></div>`;
  }
  function retry(){ S.L6=null; goto('menu'); }
  function restartGame(){ hardRestart(); }
  return {render,judge,nextWitness,answerSurprise,retry,restartGame};
})();

function buildHeroFx(){
  const el=document.getElementById('hero-bgfx');
  const gears=[{cls:'gear',top:'8%',left:'6%'},{cls:'gear g2',top:'60%',left:'82%'},{cls:'gear g3',top:'72%',left:'10%'},{cls:'gear g2',top:'14%',left:'86%'}];
  let html=gears.map(g=>`<span class="${g.cls}" style="top:${g.top}; left:${g.left};">⚙️</span>`).join('');
  for(let i=0;i<10;i++){
    html+=`<span class="puff" style="left:${(Math.random()*94)}%; animation-delay:${(Math.random()*8).toFixed(1)}s;"></span>`;
  }
  for(let i=0;i<8;i++){
    const icons=['🔧','🔩'];
    html+=`<span class="thread" style="top:${10+Math.random()*75}%; left:${5+Math.random()*88}%; animation-delay:${(Math.random()*6).toFixed(1)}s;">${icons[i%2]}</span>`;
  }
  el.innerHTML=html;
}

<script>
/* ===== ART v2: minh họa vẽ bằng code (SVG), cốt truyện Lesta, thanh kéo ===== */
const ART=(()=>{
const V=(a,b)=>S.lang==='vi'?a:b;
const T=(x,y,s,c,f=13,w=700,a='middle')=>`<text x="${x}" y="${y}" fill="${c}" font-size="${f}" font-weight="${w}" text-anchor="${a}" font-family="Inter,sans-serif">${s}</text>`;
const pill=(x,y,s,w)=>`<rect x="${x-w/2}" y="${y-13}" width="${w}" height="19" rx="9.5" fill="#22090d" opacity=".72"/>`+T(x,y+1,s,'#fff4d8',11);
function defs(p,a,b,c){return `<defs>
<linearGradient id="${p}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".65" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>
<pattern id="${p}b" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#a5563a"/><path d="M0 .5H16M0 4.5H16M8 .5V4.5M0 4.5V8M16 4.5V8" stroke="#7c3b28" stroke-width="1" fill="none"/></pattern>
<pattern id="${p}p" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="20" height="10" fill="#8a5f3a"/><path d="M0 .5H20M10 .5V10" stroke="#5e3d22" stroke-width="1"/></pattern>

/* ---- gắn vào game ---- */
const _rm=roadmap; roadmap=function(n){ return _rm(n)+ART.banner(n); };
const _om=openModal; openModal=function(h){ _om(ART.ico(h)+h); };
const _sh=statHTML; statHTML=function(cls,icon,...r){ return _sh(cls,ART.ICN[icon]||icon,...r); };

/* ---- thanh kéo: kéo mượt, không dựng lại DOM khi đang kéo ---- */
function paintRange(el){ const mn=+el.min||0,mx=+el.max||100; el.style.setProperty('--p',((+el.value-mn)/(mx-mn)*100)+'%'); }
function paintRanges(){ document.querySelectorAll('input[type=range]').forEach(paintRange); }
function liveSet(el,mod,k){
  const v=+el.value; S[mod][k]=v; paintRange(el);
  const b=el.previousElementSibling&&el.previousElementSibling.querySelector('b');
  if(b) b.textContent=(b.textContent.trim().startsWith('$')?'$':'')+v.toLocaleString('en-US');
}
const _ri=renderInto; renderInto=function(){ _ri(); paintRanges(); };
const _rd=render; render=function(){ _rd(); paintRanges(); };

/* ---- màn cốt truyện ---- */
let storyI=0;
function renderStory(){
  const s=ART.STORY[storyI], l=S.lang==='vi'?0:1, last=storyI===ART.STORY.length-1;
  const you = S.role==='capital' ? ART.V('Bạn sẽ vào vai Yi Long Ma, chủ hãng Lesta.','You will play Yi Long Ma, owner of Lesta.') : ART.V('Bạn sẽ vào vai một thợ cơ khí xin việc ở Lesta, dưới quyền Yi Long Ma.','You will play a mechanic looking for work at Lesta, under Yi Long Ma.');
  document.getElementById('story-box').innerHTML=`
    <div class="story-art"><svg viewBox="0 0 600 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${s.t[l]}">${s.art()}</svg></div>
    <div class="story-dots">${ART.STORY.map((_,i)=>`<i class="${i===storyI?'on':''}"></i>`).join('')}</div>
    <h2>${s.t[l]}</h2><p>${s.p[l]}</p>${last?`<p class="story-you">${you}</p>`:''}
    <div class="start-actions" style="margin-top:18px;">
      <button class="btn ghost" onclick="endStory()">${ART.V('Bỏ qua','Skip')}</button>
      <button class="btn primary" onclick="storyNext()">${last?ART.V('Vào xưởng Lesta →','Enter Lesta →'):ART.V('Tiếp →','Next →')}</button>
    </div>`;
}
function showStory(){ storyI=0; document.getElementById('diff-screen').style.display='none'; document.getElementById('story-screen').style.display='flex'; renderStory(); window.scrollTo(0,0); }
function storyNext(){ if(storyI<ART.STORY.length-1){ storyI++; renderStory(); } else endStory(); }
function endStory(){ document.getElementById('story-screen').style.display='none'; const was=document.getElementById('app').style.display==='flex'; document.getElementById('app').style.display='flex'; if(!was) goto('menu'); }

/* ---- màn đầu & thẻ vai: thay emoji bằng tranh ---- */
function paintHero(){ const h=document.getElementById('hero-art'); if(h) h.innerHTML=ART.hero(); }
const _ss=showStart; showStart=function(){ _ss(); paintHero(); };
const _sr=showRoleScreen; showRoleScreen=function(){ _sr(); ['capital','worker'].forEach(k=>{ const e=document.querySelector('#rc-'+k+' .emoji'); if(e) e.innerHTML=ART.role(k); }); };
paintHero();
</script>
</body>
</html>
